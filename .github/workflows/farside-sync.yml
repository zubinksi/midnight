name: Sync Farside ETF Flows

on:
  schedule:
    # Twice daily on weekdays — Farside updates once/day after close.
    # 2 runs/day × ~22 weekdays = ~44 req/month (well within 1,000/month free tier).
    - cron: '0 13 * * 1-5'   # 9 AM ET (before open)
    - cron: '0 22 * * 1-5'   # 6 PM ET (after close)
  workflow_dispatch: # allow manual trigger from GitHub Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync Farside to Upstash
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: node scripts/sync-farside.mjs
