name: Sync HypeStrat Transactions

on:
  schedule:
    # Weekly on Monday at 10:00 UTC — HypeStrat publishes irregularly, weekly
    # polling is sufficient and well within ScraperAPI free tier (4 req/month).
    - cron: '0 10 * * 1'
  workflow_dispatch: # allow manual trigger from GitHub Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync HypeStrat to Upstash
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: node scripts/sync-hypestrat.mjs
